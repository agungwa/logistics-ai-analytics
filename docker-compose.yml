# Local full-stack run: docker compose up --build
# App on http://localhost:3000 (admin@demo.com / demo1234)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://logistics:logistics@db:5432/logistics
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-please-generate-a-real-secret}
      # AI provider (GLM via z.ai, Anthropic protocol). Without a key the app
      # still runs — the AI Analyst returns a clear configuration error.
      AI_PROVIDER: anthropic
      AI_BASE_URL: https://api.z.ai/api/anthropic
      AI_MODEL: glm-4.6
      AI_API_KEY: ${AI_API_KEY:-}
      # Optional SMTP for invite emails
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
